# tmux. Ctrl-a prefix, because Ctrl-b collides with the pager and with vim.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0          # else the Esc key lags in vim
set -g focus-events on         # nvim autoread needs this
set -g set-clipboard on

# Truecolour. The terminal-features line is the one that actually works in
# tmux 3.2+; the old `terminal-overrides Tc` is kept for older servers.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -ga terminal-overrides ",*256col*:Tc"

# Splits that keep the current directory, and that read like the key.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# vi motions everywhere
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Status bar: quiet, left is session, right is host and time.
set -g status-position bottom
set -g status-style 'bg=default fg=colour245'
set -g status-left '#[fg=colour39,bold] #S #[default]'
set -g status-left-length 30
set -g status-right '#[fg=colour245]#h  %Y-%m-%d %H:%M '
setw -g window-status-current-style 'fg=colour39,bold'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
set -g pane-active-border-style 'fg=colour39'
set -g pane-border-style 'fg=colour238'
