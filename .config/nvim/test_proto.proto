syntax = "proto3";

package dataservice;

option go_package = "github.com/company/dataservice/proto";

// Data processing service for analytics platform
service DataService {
  // Process batch data
  rpc ProcessBatch(BatchRequest) returns (BatchResponse);

  // Stream real-time data
  rpc StreamData(stream DataPoint) returns (stream ProcessedData);

  // Get processing status
  rpc GetStatus(StatusRequest) returns (StatusResponse);
}

// Request for batch processing
message BatchRequest {
  string batch_id = 1;
  repeated DataPoint data_points = 2;
  ProcessingConfig config = 3;
  int64 timestamp = 4;
}

// Response for batch processing
message BatchResponse {
  string batch_id = 1;
  ProcessingResult result = 2;
  repeated string errors = 3;
  int64 processed_at = 4;
}

// Individual data point
message DataPoint {
  string id = 1;
  double value = 2;
  map<string, string> metadata = 3;
  int64 timestamp = 4;
  DataType type = 5;
}

// Processed data output
message ProcessedData {
  string id = 1;
  double processed_value = 2;
  double confidence = 3;
  map<string, double> metrics = 4;
  int64 processed_at = 5;
}

// Processing configuration
message ProcessingConfig {
  Algorithm algorithm = 1;
  map<string, string> parameters = 2;
  bool enable_validation = 3;
  double threshold = 4;
}

// Processing result summary
message ProcessingResult {
  int32 total_processed = 1;
  int32 successful = 2;
  int32 failed = 3;
  double average_confidence = 4;
  map<string, double> statistics = 5;
}

// Status request
message StatusRequest {
  string batch_id = 1;
}

// Status response
message StatusResponse {
  string batch_id = 1;
  ProcessingStatus status = 2;
  double progress = 3;
  string message = 4;
  int64 started_at = 5;
  int64 estimated_completion = 6;
}

// Data type enumeration
enum DataType {
  DATA_TYPE_UNKNOWN = 0;
  DATA_TYPE_NUMERIC = 1;
  DATA_TYPE_CATEGORICAL = 2;
  DATA_TYPE_TEMPORAL = 3;
  DATA_TYPE_TEXT = 4;
  DATA_TYPE_BINARY = 5;
}

// Processing algorithm enumeration
enum Algorithm {
  ALGORITHM_UNKNOWN = 0;
  ALGORITHM_LINEAR_REGRESSION = 1;
  ALGORITHM_RANDOM_FOREST = 2;
  ALGORITHM_NEURAL_NETWORK = 3;
  ALGORITHM_CLUSTERING = 4;
  ALGORITHM_ANOMALY_DETECTION = 5;
}

// Processing status enumeration
enum ProcessingStatus {
  STATUS_UNKNOWN = 0;
  STATUS_PENDING = 1;
  STATUS_RUNNING = 2;
  STATUS_COMPLETED = 3;
  STATUS_FAILED = 4;
  STATUS_CANCELLED = 5;
}