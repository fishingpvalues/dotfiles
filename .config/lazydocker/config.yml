# lazydocker configuration (SOTA 2025)
# https://github.com/jesseduffield/lazydocker
# Location: ~/.config/lazydocker/config.yml

gui:
  # UI settings
  scrollHeight: 2
  scrollPastBottom: true
  mouseEvents: true
  skipDiscardChangeWarning: false
  skipStashWarning: true
  sidePanelWidth: 0.3333
  expandFocusedSidePanel: false

  # GitHub Dark theme colors
  theme:
    activeBorderColor:
      - '#61afef'
      - bold
    inactiveBorderColor:
      - '#4b5263'
    optionsTextColor:
      - '#61afef'
    selectedLineBgColor:
      - '#2c323c'
    selectedRangeBgColor:
      - '#2c323c'

  # Border style
  border: 'rounded'

  # Show all containers by default
  showAllContainers: false

  # Language
  language: 'auto'

# Confirm before quitting
confirmOnQuit: false

# Logging
logging:
  tail: 100

# Command templates for docker-compose
commandTemplates:
  dockerCompose: docker-compose
  restartService: '{{ .DockerCompose }} restart {{ .Service.Name }}'
  up: '{{ .DockerCompose }} up -d'
  down: '{{ .DockerCompose }} down'
  downWithVolumes: '{{ .DockerCompose }} down --volumes'
  upService: '{{ .DockerCompose }} up -d {{ .Service.Name }}'
  startService: '{{ .DockerCompose }} start {{ .Service.Name }}'
  stopService: '{{ .DockerCompose }} stop {{ .Service.Name }}'
  serviceLogs: '{{ .DockerCompose }} logs --follow {{ .Service.Name }}'
  viewServiceLogs: '{{ .DockerCompose }} logs --follow {{ .Service.Name }}'
  rebuildService: '{{ .DockerCompose }} up -d --build {{ .Service.Name }}'
  recreateService: '{{ .DockerCompose }} up -d --force-recreate {{ .Service.Name }}'
  allLogs: '{{ .DockerCompose }} logs --tail=300 --follow'
  viewAlLogs: '{{ .DockerCompose }} logs --tail=300 --follow'
  dockerComposeConfig: '{{ .DockerCompose }} config'
  checkDockerComposeConfig: '{{ .DockerCompose }} config --quiet'
  serviceTop: '{{ .DockerCompose }} top {{ .Service.Name }}'

# Update frequency (milliseconds)
stats:
  graphs:
    - caption: CPU (%)
      statPath: DerivedStats.CPUPercentage
      color: cyan
    - caption: Memory (%)
      statPath: DerivedStats.MemoryPercentage
      color: green

# OS-specific commands
oS:
  openCommand: open {{filename}}
  openLinkCommand: open {{link}}

# Custom commands
customCommands:
  containers:
    - name: bash
      attach: true
      command: 'docker exec -it {{ .Container.ID }} bash'
      serviceNames: []
    - name: sh
      attach: true
      command: 'docker exec -it {{ .Container.ID }} sh'
      serviceNames: []

# SOTA Note: lazydocker provides a terminal UI for Docker with vim-style navigation
# Use hjkl for navigation, enter to select, 'l' for logs, 'x' to remove
# Press '?' for help, 'q' to quit, 'e' to edit config
