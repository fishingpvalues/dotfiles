# Starship prompt configuration (SOTA 2025)
# https://starship.rs
# Location: ~/.config/starship/starship.toml

# Minimal, fast prompt with vim mode support
format = """
[](fg:#61afef)\
$username\
[](bg:#98c379 fg:#61afef)\
$directory\
[](fg:#98c379 bg:#e5c07b)\
$git_branch\
$git_status\
[](fg:#e5c07b bg:#e06c75)\
$nodejs\
$rust\
$golang\
$python\
[](fg:#e06c75 bg:#56b6c2)\
$docker_context\
[](fg:#56b6c2 bg:#c678dd)\
$time\
[ ](fg:#c678dd)\
$line_break\
$character"""

# Wait 10 milliseconds for starship to check files
scan_timeout = 10
command_timeout = 500

# Add newline before prompt
add_newline = true

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
vimcmd_visual_symbol = '[❮](bold yellow)'
vimcmd_replace_symbol = '[❮](bold purple)'
vimcmd_replace_one_symbol = '[❮](bold purple)'

[username]
style_user = 'bg:#61afef fg:#1a1b26'
style_root = 'bg:#61afef fg:#e06c75'
format = '[$user ]($style)'
disabled = false
show_always = true

[directory]
style = 'bg:#98c379 fg:#1a1b26'
format = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = '…/'

[directory.substitutions]
'Documents' = '󰈙 '
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
symbol = ' '
style = 'bg:#e5c07b fg:#1a1b26'
format = '[ $symbol$branch ]($style)'

[git_status]
style = 'bg:#e5c07b fg:#1a1b26'
format = '[$all_status$ahead_behind ]($style)'
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
conflicted = '='
deleted = '✘'
renamed = '»'
modified = '!'
staged = '+'
untracked = '?'
stashed = '$'

[nodejs]
symbol = ' '
style = 'bg:#e06c75 fg:#1a1b26'
format = '[ $symbol($version) ]($style)'

[rust]
symbol = ' '
style = 'bg:#e06c75 fg:#1a1b26'
format = '[ $symbol($version) ]($style)'

[golang]
symbol = ' '
style = 'bg:#e06c75 fg:#1a1b26'
format = '[ $symbol($version) ]($style)'

[python]
symbol = ' '
style = 'bg:#e06c75 fg:#1a1b26'
format = '[ $symbol($version) ]($style)'

[docker_context]
symbol = ' '
style = 'bg:#56b6c2 fg:#1a1b26'
format = '[ $symbol$context ]($style)'
only_with_files = true

[time]
disabled = false
time_format = '%R'
style = 'bg:#c678dd fg:#1a1b26'
format = '[ ♥ $time ]($style)'

# Package versions
[package]
disabled = true

# SOTA Note: Starship is a fast, minimal prompt
# Supports vim mode indicators via shell integration
# For fish shell: set -U fish_key_bindings fish_vi_key_bindings
# For zsh: bindkey -v
