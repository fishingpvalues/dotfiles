# Yazi file manager configuration (SOTA 2025)
# https://yazi-rs.github.io
# Location: ~/.config/yazi/yazi.toml

[manager]
# Layout
layout = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
# Preview settings
tab_size = 4
max_width = 600
max_height = 900
cache_dir = ""
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
# File openers (customize based on your system)
edit = [
    { run = 'nvim "$@"', block = true, for = "unix" },
]
play = [
    { run = 'mpv "$@"', orphan = true, for = "unix" },
    { run = 'mpv "%*"', orphan = true, for = "windows" },
]
open = [
    { run = 'xdg-open "$@"', desc = "Open", for = "linux" },
    { run = 'open "$@"', desc = "Open", for = "macos" },
    { run = 'start "" "%1"', orphan = true, desc = "Open", for = "windows" },
]

[open]
# File associations
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "image/*", use = "open" },
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },
    { mime = "inode/directory", use = "open" },
]

[tasks]
# Task manager settings
micro_workers = 5
macro_workers = 10
bizarre_retry = 5
image_alloc = 536870912  # 512MB
image_bound = [0, 0]
suppress_preload = false

[plugin]
# Plugin settings
preloaders = [
    { name = "*", cond = "!mime", run = "mime", multi = true, prio = "high" },
]
previewers = [
    { name = "*/", run = "folder", sync = true },
    { mime = "text/*", run = "code" },
    { mime = "*/xml", run = "code" },
    { mime = "*/json", run = "json" },
    { name = "*.md", run = "code" },
    { mime = "image/*", run = "image" },
    { mime = "video/*", run = "video" },
    { mime = "application/pdf", run = "pdf" },
]

# SOTA Note: Yazi is a terminal file manager with vim keybindings
# Use hjkl for navigation, <space> to select, <enter> to open
# Press '~' to toggle hidden files, 'g' for top, 'G' for bottom
