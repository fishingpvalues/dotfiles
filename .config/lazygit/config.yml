# lazygit configuration (SOTA 2025)
# https://github.com/jesseduffield/lazygit
# Location: ~/.config/lazygit/config.yml

gui:
  # GitHub Dark theme colors
  theme:
    activeBorderColor:
      - '#61afef'
      - bold
    inactiveBorderColor:
      - '#4b5263'
    selectedLineBgColor:
      - '#2c323c'
    cherryPickedCommitBgColor:
      - '#56b6c2'
    cherryPickedCommitFgColor:
      - '#61afef'

  # UI settings
  showFileTree: true
  showListFooter: true
  showRandomTip: false
  showBottomLine: true
  showCommandLog: true
  commandLogSize: 8
  splitDiff: 'auto'
  skipRewordInEditorWarning: false
  border: 'rounded'

  # Vim-style scrolling
  scrollHeight: 2
  scrollPastBottom: true

  # Mouse support
  mouseEvents: true

  # Skip stash warning when quitting
  skipStashWarning: false

  # Show branch heads in commit graph
  showBranchCommitHash: true

  # Nerd fonts icons (if available)
  nerdFontsVersion: "3"

git:
  # Git behavior
  paging:
    colorArg: always
    pager: delta --dark --paging=never

  commit:
    signOff: false
    autoWrapCommitMessage: true
    autoWrapWidth: 72

  merging:
    manualCommit: false
    args: ''

  # Show whole git log by default
  log:
    order: 'topo-order'
    showGraph: 'always'
    showWholeGraph: false

  skipHookPrefix: WIP
  autoFetch: true
  autoRefresh: true
  branchLogCmd: 'git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --'
  allBranchesLogCmd: 'git log --graph --all --color=always --abbrev-commit --decorate --date=relative  --pretty=medium'
  overrideGpg: false
  disableForcePushing: false

# Update frequency (seconds)
refresher:
  refreshInterval: 10
  fetchInterval: 60

# Confirm before force pushing
confirmOnQuit: false

# Keybindings (vim-style defaults)
keybinding:
  universal:
    quit: 'q'
    quit-alt1: '<c-c>'
    return: '<esc>'
    quitWithoutChangingDirectory: 'Q'
    togglePanel: '<tab>'
    prevItem: 'k'
    nextItem: 'j'
    prevItem-alt: '<up>'
    nextItem-alt: '<down>'
    prevPage: 'K'
    nextPage: 'J'
    scrollLeft: 'H'
    scrollRight: 'L'
    gotoTop: 'g'
    gotoBottom: 'G'
    prevBlock: '<left>'
    nextBlock: '<right>'
    prevBlock-alt: 'h'
    nextBlock-alt: 'l'
    nextMatch: 'n'
    prevMatch: 'N'
    startSearch: '/'
    optionMenu: '<disabled>'
    optionMenu-alt1: '?'
    select: '<space>'
    goInto: '<enter>'
    remove: 'd'
    new: 'n'
    edit: 'e'
    openFile: 'o'
    scrollUpMain: '<pgup>'
    scrollDownMain: '<pgdown>'
    scrollUpMain-alt1: 'K'
    scrollDownMain-alt1: 'J'
    scrollUpMain-alt2: '<c-u>'
    scrollDownMain-alt2: '<c-d>'
    executeCustomCommand: ':'
    createRebaseOptionsMenu: 'm'
    pushFiles: 'P'
    pullFiles: 'p'
    refresh: 'R'
    createPatchOptionsMenu: '<c-p>'
    nextTab: ']'
    prevTab: '['
    nextScreenMode: '+'
    prevScreenMode: '_'
    undo: 'z'
    redo: '<c-z>'
    filteringMenu: '<c-s>'
    diffingMenu: 'W'
    diffingMenu-alt: '<c-e>'
    copyToClipboard: '<c-o>'

  status:
    checkForUpdate: 'u'
    recentRepos: '<enter>'

  files:
    commitChanges: 'c'
    commitChangesWithoutHook: 'w'
    amendLastCommit: 'A'
    commitChangesWithEditor: 'C'
    findBaseCommitForFixup: '<c-f>'
    confirmDiscard: 'x'
    ignoreFile: 'i'
    refreshFiles: 'r'
    stashAllChanges: 's'
    viewStashOptions: 'S'
    toggleStagedAll: 'a'
    viewResetOptions: 'D'
    fetch: 'f'
    toggleTreeView: '`'
    openMergeTool: 'M'
    openStatusFilter: '<c-b>'

  branches:
    createPullRequest: 'o'
    viewPullRequestOptions: 'O'
    copyPullRequestURL: '<c-y>'
    checkoutBranchByName: 'c'
    forceCheckoutBranch: 'F'
    rebaseBranch: 'r'
    renameBranch: 'R'
    mergeIntoCurrentBranch: 'M'
    viewGitFlowOptions: 'i'
    fastForward: 'f'
    createTag: 'T'
    pushTag: 'P'
    setUpstream: 'u'
    fetchRemote: 'f'

  commits:
    squashDown: 's'
    renameCommit: 'r'
    renameCommitWithEditor: 'R'
    viewResetOptions: 'g'
    markCommitAsFixup: 'f'
    createFixupCommit: 'F'
    squashAboveCommits: 'S'
    moveDownCommit: '<c-j>'
    moveUpCommit: '<c-k>'
    amendToCommit: 'A'
    pickCommit: 'p'
    revertCommit: 't'
    cherryPickCopy: 'c'
    cherryPickCopyRange: 'C'
    pasteCommits: 'v'
    tagCommit: 'T'
    checkoutCommit: '<space>'
    resetCherryPick: '<c-R>'
    copyCommitAttributeToClipboard: 'y'
    openLogMenu: '<c-l>'
    viewBisectOptions: 'b'

os:
  # Use Neovim for commit messages
  editPreset: 'nvim'
  edit: 'nvim {{filename}}'
  editAtLine: 'nvim +{{line}} {{filename}}'
  editAtLineAndWait: 'nvim +{{line}} {{filename}}'
  openDirInEditor: 'nvim {{dir}}'

customCommands:
  - key: '<c-r>'
    command: 'git rebase -i --autosquash {{.SelectedLocalCommit.Sha}}'
    context: 'commits'
    description: 'Interactive rebase from selected commit'
  - key: 'P'
    command: 'git push --force-with-lease'
    context: 'commits'
    description: 'Force push with lease'

# SOTA Note: lazygit provides a terminal UI for git with vim keybindings
# Use hjkl for navigation, <space> to stage, c to commit, P to push
# Press '?' for help, 'q' to quit
