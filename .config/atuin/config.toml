# Atuin shell history configuration (SOTA 2025)
# https://atuin.sh
# Location: ~/.config/atuin/config.toml

## Database & Storage
# Use SQLite database for efficient history storage
db_path = "~/.local/share/atuin/history.db"
# Use Sync v2 for better performance
sync_version = 2

## Behavior
# Immediately execute commands on selection (press Tab to edit)
enter_accept = true
# Filter commands by the current workspace (git repository)
workspaces = true
# Search mode: prefix searches from start of command, fuzzy allows flexible matching
search_mode = "fuzzy"
# Filter mode: global searches all history, host filters to current machine, etc.
filter_mode = "global"
# Style: compact shows more results, full shows more context
style = "compact"
# Show inline suggestions as you type
inline_height = 20
# Show preview of command before executing
show_preview = true

## UI & Display
# Show help info in the UI
show_help = true
# Exit Atuin on Esc
exit_mode = "return-query"

## Sync (optional - set if using Atuin server)
# sync_address = "https://api.atuin.sh"
# sync_frequency = "5m"
# auto_sync = true

## Filtering
# Exclude commands starting with a space (for private commands)
history_filter = [
    "^\\s+.*",  # Commands starting with space
]

## Stats
# Common subcommands to group in stats
# common_subcommands = ["cargo", "go", "git", "npm", "yarn", "pnpm"]

## Key bindings (vim-style navigation is default)
# Up arrow key behavior: press once for prefix search, twice for full history
up_arrow = "search"

## Performance
# Maximum number of entries to display
max_preview_height = 4
# Prefers = "simple"  # Use simple rendering for better performance

# SOTA Note: Atuin replaces your shell history with smart, searchable, syncable history
# Use Ctrl+R to search, Up arrow for quick access, Tab to edit before executing
